{% extends "base.html" %}{% block body %}<h2>Admin</h2><div class="grid card">
{% for k,v in stats.items() %}<div><div class="stat">{{v}}</div><span class="mute">{{k|capitalize}}</span></div>{% endfor %}</div>
<div class="card"><h3>Recent submissions</h3><table>{% for r in recent %}<tr><td>{{r.name}}</td><td>{{r.title}}</td><td>{{r.score|round(1)}}/{{r.total|round(1)}}</td><td>{{r.submitted}}</td></tr>{% else %}<tr><td class="mute">None yet</td></tr>{% endfor %}</table></div>{% endblock %}
