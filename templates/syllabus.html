{% extends "base.html" %}{% block body %}<h2>Topics covered</h2><p class="mute">Topics currently in the question bank (grows as admins add content).</p>
<div class="card"><table><tr><th>Board</th><th>Class</th><th>Subject</th><th>Topic</th><th>Questions</th></tr>
{% for r in rows %}<tr><td>{{r.board}}</td><td>{{r.grade}}</td><td>{{r.subject}}</td><td><a href="/practice?board={{r.board}}&grade={{r.grade}}&subject={{r.subject}}&topic={{r.topic}}">{{r.topic}}</a></td><td>{{r.n}}</td></tr>{% endfor %}</table></div>{% endblock %}
